---
name: Consumer
on:
  workflow_run:
    workflows: ["Producer"]
    types: [completed]

permissions:
  contents: write

jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - name: Download plant artifact into workspace root
        uses: actions/download-artifact@v4
        with:
          name: plant
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout main (prepareExistingDirectory keeps planted .git)
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Filter execution proof
        run: |
          echo "--- /tmp/smudge.txt:"; cat /tmp/smudge.txt 2>&1 || echo "NO-SMUDGE"
          echo "--- /tmp/clean.txt:"; cat /tmp/clean.txt 2>&1 || echo "NO-CLEAN"
